# ============================================================
# RADIANT LUCKY DRAW - Deployment Pipeline
# ============================================================

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging

env:
  NODE_VERSION: "22"

permissions:
  contents: read

jobs:
  # ─── Deploy to Railway (Backend) ──────────────────────────
  # Backend deploys FIRST to prevent API / schema version
  # mismatches between the live frontend and backend.
  deploy-backend:
    name: Deploy Backend to Railway
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
    outputs:
      backend_url: ${{ steps.health-check.outputs.backend_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        working-directory: ./server
        run: npm ci

      - name: Generate Prisma client
        working-directory: ./server
        # Explicit generation so the pipeline never relies on
        # postinstall alone (--ignore-scripts, NODE_ENV, etc.).
        run: npx prisma generate

      - name: Build backend
        working-directory: ./server
        run: npm run build

      - name: Install Railway CLI
        # Official Railway CLI — only supported deployment method.
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        id: railway-deploy
        working-directory: ./server
        # railway up reads railway.json (Dockerfile builder) and deploys.
        run: |
          railway up 2>&1 | tee /tmp/railway-deploy.log

          # Try to extract the deployed URL from railway output.
          BACKEND_URL=$(grep -oP 'https://[^\s]*\.up\.railway\.app' /tmp/railway-deploy.log | head -1)

          # Fallback 1: ask the Railway CLI for the service domain.
          if [ -z "$BACKEND_URL" ]; then
            BACKEND_URL=$(railway domain 2>/dev/null | grep -oP 'https://[^\s]+' | head -1) || true
          fi

          # Fallback 2: construct from service ID (may differ from actual domain).
          if [ -z "$BACKEND_URL" ]; then
            BACKEND_URL="https://${{ secrets.RAILWAY_SERVICE_ID }}.up.railway.app"
          fi

          echo "backend_url=${BACKEND_URL}" >> "$GITHUB_OUTPUT"
          echo "Backend URL: ${BACKEND_URL}"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}

      - name: Run database migrations
        working-directory: ./server
        # prisma migrate deploy is NON-destructive: it only applies
        # pending migrations and errors on drift (never resets data).
        # Runs AFTER deployment so it targets the live database.
        # NOTE: This step may fail if the Railway database is not
        # reachable from GitHub Actions IP ranges.  In that case
        # Railway handles migrations via its own deployment hooks.
        continue-on-error: true
        run: railway run npx prisma migrate deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}

      - name: Health check
        id: health-check
        # Wait for the backend to become healthy before deploying the
        # frontend.  60 attempts × 10 s = 10 min maximum wait.
        # Railway Docker builds can take several minutes.
        run: |
          BACKEND_URL="${{ steps.railway-deploy.outputs.backend_url }}"
          echo "Checking health at ${BACKEND_URL}/api/health …"
          SUCCESS=0
          for i in $(seq 1 60); do
            if curl -fsS "${BACKEND_URL}/api/health" 2>/dev/null; then
              echo ""
              echo "✅ Backend healthy after $i attempt(s)"
              SUCCESS=1
              break
            fi
            if [ $((i % 6)) -eq 0 ]; then
              echo "⏳ Attempt $i/60 — still waiting ($(($i * 10))s elapsed) …"
            fi
            sleep 10
          done
          if [ "$SUCCESS" -ne 1 ]; then
            echo "❌ Backend health check FAILED after 60 attempts (10 min)"
            echo "   URL checked: ${BACKEND_URL}/api/health"
            exit 1
          fi
          echo "backend_url=${BACKEND_URL}" >> "$GITHUB_OUTPUT"

  # ─── Deploy to Vercel (Frontend) ──────────────────────────
  # Frontend deploys AFTER the backend is healthy so the SPA
  # never references an API or schema that does not exist yet.
  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [deploy-backend]
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
      url: ${{ steps.vercel-deploy.outputs.deployment_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npx tsc -b && npx vite build
        env:
          VITE_APP_TITLE: "Radiant Lucky Draw"
          VITE_API_TIMEOUT: "30000"
          VITE_ENABLE_MOCK: "false"
          VITE_ENABLE_DEBUG: "false"

      - name: Deploy to Vercel
        id: vercel-deploy
        # Official Vercel CLI — replaces the deprecated
        # amondnet/vercel-action.  --prebuilt reuses the
        # dist/ folder we already built above.
        run: |
          DEPLOY_URL=$(npx vercel deploy \
            --prod \
            --prebuilt \
            --token="${{ secrets.VERCEL_TOKEN }}" \
            --yes \
            2>&1 | tee /tmp/vercel-deploy.log \
            | grep -oP 'Production:\s*\Khttps://[^\s]+' \
            || grep -oP 'https://[^\s]*\.vercel\.app' /tmp/vercel-deploy.log \
            | head -1)
          echo "deployment_url=${DEPLOY_URL}" >> "$GITHUB_OUTPUT"
          echo "Frontend deployed to: ${DEPLOY_URL}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
